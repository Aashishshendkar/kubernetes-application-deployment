apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-web-deployment
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-web-app
  template:
    metadata:
      labels:
        app: gitops-web-app
    spec:
      containers:
        - name: gitops-web-app
          image: aashishshendkar/gitops-web-app:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
